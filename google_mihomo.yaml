# 3x-ui v3.11.0 — Mihomo Global Routing Rules (inline YAML)
# Paste the ENTIRE file into Settings → Subscription → Clash / Mihomo → Global routing rules.
# Enable the Clash/Mihomo routing toggle before saving.
# This is a routing/profile fragment for 3x-ui, NOT a standalone config.yaml.
# Proxy nodes are generated by 3x-ui for each subscriber; include-all picks them up automatically.
# TUN/listeners are intentionally omitted: enable TUN/VPN mode in each client app separately.
# IPv6 is disabled in the Mihomo core and explicitly rejected by the first routing rule.
# UDP/443 (QUIC) is NOT blocked; QUIC sniffing remains enabled for compatibility.

mode: rule
ipv6: false
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - rule-set:private-domains
  - +.lan
  - +.local
  - +.home.arpa
  default-nameserver:
  - 8.8.8.8
  - 1.1.1.1
  proxy-server-nameserver:
  - https://dns.google/dns-query
  direct-nameserver:
  - https://dns.google/dns-query
  nameserver:
  - https://dns.google/dns-query#PROXY
sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-dst-address:
  - 224.0.0.0/3
  - 10.0.0.0/8
  - 127.0.0.0/8
  - 100.64.0.0/10
  - 172.16.0.0/12
  - 198.18.0.0/15
  - 169.254.0.0/16
  - 192.168.0.0/16
  - 192.0.0.0/24
  - 192.0.2.0/24
  - 192.88.99.0/24
  - 198.51.100.0/24
  - 203.0.113.0/24
  - fc00::/7
  - ff00::/8
  - fe80::/10
  - ::/127
proxy-groups:
- name: 🛡️ VPN
  icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hijacking.png
  type: select
  proxies:
  - ⚡️ Авто
  include-all: true
- name: 📺 Youtube
  icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
  type: select
  proxies:
  - 🛡️ VPN
  include-all: true
- name: 💬 Discord
  icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png
  type: select
  proxies:
  - 🛡️ VPN
  include-all: true
- name: 🎮 Игры
  icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
  type: select
  proxies:
  - 🔓 Без VPN
  - 🛡️ VPN
  include-all: true
- name: ⚡️ Авто
  type: url-test
  tolerance: 150
  url: https://www.gstatic.com/generate_204
  interval: 300
  include-all: true
  hidden: true
- name: PROXY
  type: select
  proxies:
  - 🛡️ VPN
  hidden: true
- name: 🔓 Без VPN
  type: select
  proxies:
  - DIRECT
  hidden: true
